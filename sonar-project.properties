# sonar-project.properties
sonar.projectKey=andreamgom_synthea-fhir-devops
sonar.organization=andreamgom

sonar.projectName=synthea-fhir-devops
sonar.projectVersion=1.0

sonar.sources=.
sonar.exclusions=**/.terraform/**,**/node_modules/**,**/*.tfstate,**/*.tfstate.backup,data/**,test_bundle.json

sonar.language=python

# Cobertura: se genera en CI con pytest-cov (coverage.xml)
sonar.python.coverage.reportPaths=coverage.xml
# Lo que no es codigo de aplicacion testeable no cuenta para la cobertura
sonar.coverage.exclusions=scripts/**,terraform/**,**/static/**,tests/**,.github/**

# githubactions:S8544 (fijar dependencias con hashes) se descarta en el workflow de CI:
# las dependencias de los requirements ya van con version exacta (==) y se instalan
# en un runner efimero solo para ejecutar los tests.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=githubactions:S8544
sonar.issue.ignore.multicriteria.e1.resourceKey=.github/workflows/ci.yml
