# services/monitoring/prometheus.yml
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "hapi-fhir"
    static_configs:
      - targets: ["fhir-server:8080"]
    metrics_path: "/actuator/prometheus"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]