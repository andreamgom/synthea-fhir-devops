# deploy/local/docker-compose.yml
version: "3.8"

services:

  fhir-server:
    image: hapiproject/hapi:v7.2.0
    container_name: synthea-fhir
    ports:
      - "8080:8080"
    environment:
      - hapi.fhir.fhir_version=R4
      - management.endpoints.web.exposure.include=prometheus,health,info
      - management.endpoint.prometheus.enabled=true
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/fhir/metadata || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: synthea-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ../../services/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    depends_on:
      - fhir-server

  grafana:
    image: grafana/grafana:10.4.0
    container_name: synthea-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  grafana_data: